<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soup Intelligence OS — Founder Branding Engine</title>
    <!-- Fonts & Google Icons Library -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Tailwind CDN for exact Stitch fidelity -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "canary": "#FAD02C",
              "accent-yellow": "#F5C518",
              "surface": "#F8FAFC",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "Outfit", "sans-serif"],
              body: ["Hanken Grotesk", "sans-serif"]
            },
            boxShadow: {
              "apple-subtle": "0 20px 45px -15px rgba(15, 23, 42, 0.07), 0 0 1px 1px rgba(15, 23, 42, 0.04)",
              "apple-card": "0 25px 50px -12px rgba(15, 23, 42, 0.08)",
              "apple-btn": "0 10px 25px -5px rgba(250, 208, 44, 0.45)"
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
